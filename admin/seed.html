<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heisenbyte | Seed Questions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        body {
            padding: 32px;
        }

        .seed-wrap {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .seed-title {
            font-family: var(--font-title);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 0 12px var(--green-glow);
            letter-spacing: 3px;
        }

        .log-area {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-dim);
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 2;
        }

        .log-area .ok {
            color: var(--green);
        }

        .log-area .err {
            color: var(--danger);
        }

        .log-area .inf {
            color: var(--warning);
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-scanline"></div>

    <div class="page-wrap">
        <header class="admin-header">
            <div class="logo-wrap">
                <div class="logo-icon">⚗️</div>
                <span class="logo-text">HEIS<span>EN</span>BYTE</span>
            </div>
            <div class="header-right">
                <span class="admin-badge">DB SEEDER</span>
                <a class="btn btn-outline" href="index.html" style="padding:7px 14px;font-size:0.78rem;">← BACK</a>
            </div>
        </header>

        <div style="flex:1;padding:32px;">
            <div class="seed-wrap">
                <div class="seed-title">🌱 FIRESTORE SEEDER</div>
                <p style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-dim);line-height:1.8;">
                    This tool seeds the Firestore database with sample technical questions and resets the quiz state.
                    Run this tool <strong style="color:var(--green)">once before each event</strong>.
                </p>

                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    <button class="btn btn-primary" id="seed-btn">🌱 SEED QUESTIONS</button>
                    <button class="btn btn-warning" id="reset-btn">🔄 RESET QUIZ STATE</button>
                    <button class="btn btn-danger" id="clear-btn">🗑 CLEAR ALL DATA</button>
                </div>

                <div class="log-area" id="log"></div>
            </div>
        </div>
    </div>

    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // ============================================================
        // SAMPLE QUESTIONS — Replace/expand for your event
        // ============================================================
        const SAMPLE_QUESTIONS = [

            {
                order: 5,
                questionText: "Which function converts an iterable into a list of (index, value) pairs?",
                options: ["iter()", "zip()", "enumerate()", "map()"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 4,
                questionText: "What function is used to check if all elements in an iterable are true?",
                options: ["any()", "all()", "bool()", "true()"],
                correctAnswer: "B",
                basePoints: 100
            },
            {
                order: 3,
                questionText: "Which function converts a number to its corresponding Unicode character?",
                options: ["ord()", "unicode()", "char()", "chr()"],
                correctAnswer: "D",
                basePoints: 100
            },
            {
                order: 0,
                questionText: "In which year was Python officially released?",
                options: ["1985", "1989", "1991", "2000"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 1,
                questionText: "Python was created as a successor to which programming language?",
                options: ["Java", "ABC", "C++", "Pascal"],
                correctAnswer: "B",
                basePoints: 100
            },
            {
                order: 2,
                questionText: "a = [1,2,3]\nb = [1,2,3]\nprint(a is b)\nprint(a in b)\n\nWhat is the output?",
                options: ["True True", "False True", "False False", "Error"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 6,
                questionText: "a = [1,2,3]\nb = [[1,2,3]]\nprint(a in b)\n\nWhat is the output?",
                options: ["True", "False", "Error", "None"],
                correctAnswer: "A",
                basePoints: 100
            },
            {
                order: 7,
                questionText: "print(5/2)\nprint(5//2)\n\nWhat is the output?",
                options: ["2 and 2", "2 and 2.5", "2.5 and 2.5", "2.5 and 2"],
                correctAnswer: "D",
                basePoints: 100
            },
            {
                order: 8,
                questionText: "print(5 or 10)\nprint(5 and 10)\n\nWhat is the output?",
                options: ["5 5", "5 10", "10 10", "Error"],
                correctAnswer: "B",
                basePoints: 100
            },

            // ═══════════════════════════════════════════
            //  🟡 MEDIUM — ML / AI Concepts (150 pts)
            // ═══════════════════════════════════════════

            {
                order: 9,
                questionText: "Which Scikit-learn function splits data into training and testing sets?",
                options: ["split_data()", "train_test()", "train_test_split()", "data_split()"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 10,
                questionText: "Which metric function evaluates how far predictions deviate from actual values?",
                options: ["accuracy_score()", "recall_score()", "mean_squared_error()", "f1_score()"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 11,
                questionText: "Which activation function outputs values between 0 and 1?",
                options: ["ReLU", "Softmax", "Tanh", "Sigmoid"],
                correctAnswer: "D",
                basePoints: 100
            },
            {
                order: 12,
                questionText: "Which loss function is commonly used for binary classification?",
                options: ["mean_squared_error", "categorical_crossentropy", "binary_crossentropy", "hinge_loss"],
                correctAnswer: "C",
                basePoints: 100
            },
            {
                order: 13,
                questionText: "Which algorithm uses a heuristic function to find the optimal path?",
                options: ["Breadth First Search", "Depth First Search", "A* Search", "Minimax"],
                correctAnswer: "C",
                basePoints: 100
            },

            // ═══════════════════════════════════════════
            //  🔴 HARD — Code Debugging & Fix-the-Bug (200 pts)
            // ═══════════════════════════════════════════
            {
                order: 14,
                questionText: "X = np.array([1, 2, 3])\nw = np.array([[0.2], [0.5], [0.1]])\ny = X @ w\n\nWhat will fix the shape issue to make output (1,1)?",
                options: [
                    "X = np.array([[1, 2, 3]])",
                    "w = np.array([0.2, 0.5, 0.1])",
                    "y = np.dot(w, X)",
                    "X = X.reshape(3, 1)"
                ],
                correctAnswer: "A",
                basePoints: 100
            },
            {
                order: 15,
                questionText: "X = [[1],[2],[3],[4]]\ny = [0,1,0]\nX_train, X_test, y_train, y_test = train_test_split(X, y)\n\nWhich option fixes the error?",
                options: [
                    "y = [0,1,0,1]",
                    "X = [[1],[2],[3]]",
                    "X = [1,2,3]",
                    "train_test_split(y, X)"
                ],
                correctAnswer: "A",
                basePoints: 100
            },
            {
                order: 16,
                questionText: "a = [[1,2],[3,4]]\nb = a.copy()\nb[0][0] = 99\nprint(a)\n\nHow do you prevent modifying `a`?",
                options: [
                    "import copy; b = copy.deepcopy(a)",
                    "b = list(a)",
                    "b = a[:]",
                    "b = tuple(a)"
                ],
                correctAnswer: "A",
                basePoints: 100
            },
            {
                order: 17,
                questionText: "x = [1,2,3]\ny = [1,2,3]\nif x is y:\n    print(\"Equal\")\n\nWhich fix correctly compares values?",
                options: [
                    "if x == y:",
                    "if id(x) == id(y):",
                    "if x.equals(y):",
                    "if list(x) is list(y):"
                ],
                correctAnswer: "A",
                basePoints: 100
            },
            {
                order: 20,
                questionText: "def update(d, key, value):\n    temp = d\n    temp[key] = value\n    return temp\n\ndata = {\"a\":1}\nnew_data = update(data, \"b\", 2)\n\nWhat is the correct fix to avoid mutating `data`?",
                options: [
                    "temp = d.copy()",
                    "temp = dict(d)",
                    "import copy; temp = copy.deepcopy(d)",
                    "All of the above"
                ],
                correctAnswer: "D",
                basePoints: 100
            }
        ];

        const logEl = document.getElementById("log");

        function log(msg, type = "") {
            const div = document.createElement("div");
            div.className = type;
            div.textContent = msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ── SEED ──
        document.getElementById("seed-btn").addEventListener("click", async () => {
            log("⚡ Starting question seed...", "inf");
            let count = 0;
            try {
                for (const q of SAMPLE_QUESTIONS) {
                    await HB.questionsRef.add(q);
                    count++;
                    log(`✓ Added: Q${count} — ${q.questionText.substring(0, 50)}...`, "ok");
                }
                log(`\n✅ ${count} questions seeded successfully!`, "ok");
                log(`📋 Quiz is ready to run.`, "ok");
            } catch (e) {
                log(`✗ Error: ${e.message}`, "err");
                console.error(e);
            }
        });

        // ── RESET STATE ──
        document.getElementById("reset-btn").addEventListener("click", async () => {
            if (!confirm("Reset quiz state to IDLE?")) return;
            log("🔄 Resetting quiz state...", "inf");
            try {
                // Use the metadata shape expected by the client and functions
                await HB.quizStateRef.set({
                    status: "idle",
                    currentQuestion: 0,
                    totalQuestions: SAMPLE_QUESTIONS.length,
                    questionStartTime: null,
                    questionEndTime: null,
                    timeLimitSeconds: 15,
                    answerRevealed: false,
                    updatedAt: null
                }, { merge: true });
                log("✅ Quiz state reset to idle", "ok");
            } catch (e) {
                log(`✗ Error: ${e.message}`, "err");
            }
        });

        // ── CLEAR ALL ──
        document.getElementById("clear-btn").addEventListener("click", async () => {
            if (!confirm("WARNING: This will delete ALL questions, teams, and responses from Firestore. Continue?")) return;
            log("🗑 Clearing all Firestore data...", "inf");
            try {
                const collections = ["questions", "teams", "responses"];
                for (const col of collections) {
                    const snap = await HB.db.collection(col).get();
                    const batch = HB.db.batch();
                    snap.docs.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                    log(`✓ Cleared ${snap.size} docs from '${col}'`, "ok");
                }
                log("✅ All data cleared.", "ok");
            } catch (e) {
                log(`✗ Error: ${e.message}`, "err");
            }
        });
    </script>
</body>

</html>
